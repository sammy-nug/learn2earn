<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Hack Week Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: rgba(22, 27, 34, 0.82);
      --yellow: #fcee90;
      --pink: #ff69c8;
      --cyan: #58e6ff;
      --green: #7ee787;
      --text: #f6f8fa;
      --muted: #a7b0bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(88, 230, 255, 0.25), transparent 32rem),
        radial-gradient(circle at 80% 10%, rgba(255, 105, 200, 0.22), transparent 28rem),
        radial-gradient(circle at 50% 90%, rgba(252, 238, 144, 0.18), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
      pointer-events: none;
    }

    .sparkle {
      position: fixed;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 22px var(--yellow);
      animation: float 7s ease-in-out infinite;
      opacity: 0.8;
    }

    .sparkle:nth-child(1) { top: 12%; left: 12%; animation-delay: -1s; }
    .sparkle:nth-child(2) { top: 18%; right: 15%; background: var(--cyan); box-shadow: 0 0 22px var(--cyan); animation-delay: -3s; }
    .sparkle:nth-child(3) { bottom: 14%; left: 18%; background: var(--pink); box-shadow: 0 0 22px var(--pink); animation-delay: -5s; }
    .sparkle:nth-child(4) { bottom: 22%; right: 12%; background: var(--green); box-shadow: 0 0 22px var(--green); animation-delay: -2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.35); }
    }

    main {
      width: min(980px, calc(100vw - 32px));
      padding: clamp(24px, 5vw, 56px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 34px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      position: relative;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      padding: 10px 16px;
      border: 1px solid rgba(252, 238, 144, 0.35);
      border-radius: 999px;
      background: rgba(252, 238, 144, 0.1);
      color: var(--yellow);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 24px 0 12px;
      font-size: clamp(2.6rem, 8vw, 6.5rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    h1 span {
      color: var(--yellow);
      text-shadow: 0 0 26px rgba(252, 238, 144, 0.35);
    }

    .subtitle {
      max-width: 620px;
      margin: 0 auto 34px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.2rem);
      line-height: 1.6;
    }

    .timer {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(12px, 2vw, 22px);
    }

    .time-card {
      padding: clamp(18px, 3vw, 30px) 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0.03));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .number {
      display: block;
      font-size: clamp(2.2rem, 7vw, 5rem);
      font-weight: 950;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .label {
      display: block;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .footer-note {
      margin-top: 28px;
      color: var(--green);
      font-weight: 700;
    }

    @media (max-width: 680px) {
      .timer {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>
  <span class="sparkle"></span>

  <main>
    <div class="badge">GHW Agents · Aug 7–13, 2026</div>
    <h1>Hack clock is <span>ticking</span></h1>
    <p class="subtitle">
      Countdown to the end of Global Hack Week Agents. Ship one more tiny project,
      squash one more bug, and celebrate the streak.
    </p>

    <section class="timer" aria-label="Countdown timer">
      <div class="time-card"><span class="number" id="days">00</span><span class="label">Days</span></div>
      <div class="time-card"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
      <div class="time-card"><span class="number" id="minutes">00</span><span class="label">Minutes</span></div>
      <div class="time-card"><span class="number" id="seconds">00</span><span class="label">Seconds</span></div>
    </section>

    <p class="footer-note" id="status">Target: August 13, 2026 at 11:59 PM ET</p>
  </main>

  <script>
    const target = new Date("2026-08-13T23:59:59-04:00").getTime();
    const units = {
      days: document.querySelector("#days"),
      hours: document.querySelector("#hours"),
      minutes: document.querySelector("#minutes"),
      seconds: document.querySelector("#seconds"),
    };
    const status = document.querySelector("#status");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const distance = target - Date.now();

      if (distance <= 0) {
        Object.values(units).forEach((unit) => { unit.textContent = "00"; });
        status.textContent = "Global Hack Week wrapped. Time to demo what you built!";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
      const minutes = Math.floor((distance / (1000 * 60)) % 60);
      const seconds = Math.floor((distance / 1000) % 60);

      units.days.textContent = pad(days);
      units.hours.textContent = pad(hours);
      units.minutes.textContent = pad(minutes);
      units.seconds.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
